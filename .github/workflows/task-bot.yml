name: task-bot

on:
  schedule:
    # Hourly. Each run stays connected for ~50 minutes, so the bot answers
    # in about a second instead of waiting for the next scheduled poll.
    - cron: "0 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: task-bot-run
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - name: Configure git for state commits
        run: |
          git config user.name "task-bot"
          git config user.email "task-bot@users.noreply.github.com"

      - name: Listen for messages
        run: python main.py --loop 3000 --git-sync
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
