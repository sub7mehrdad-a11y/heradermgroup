name: task-bot

on:
  schedule:
    # Hourly. Each run stays connected for ~50 minutes, so the bot answers
    # in about a second instead of waiting for the next scheduled poll.
    - cron: "0 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: task-bot-run
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      # These probes exist so a connectivity failure shows up as a named
      # step in the Actions API, which is readable without a token — the
      # job log itself is not. continue-on-error keeps every probe running
      # so one outage doesn't mask another.
      - name: Probe Telegram API
        continue-on-error: true
        run: curl -sS -f -m 20 -o /dev/null "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/getMe"

      - name: Probe Gemini API
        continue-on-error: true
        run: curl -sS -f -m 20 -o /dev/null "https://generativelanguage.googleapis.com/v1beta/models?key=${{ secrets.GEMINI_API_KEY }}"

      - name: Configure git for state commits
        run: |
          git config user.name "task-bot"
          git config user.email "task-bot@users.noreply.github.com"

      - name: Listen for messages
        run: python main.py --loop 3000 --git-sync
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Without this, Python block-buffers stdout on CI and every
          # diagnostic line stays invisible until the process ends.
          PYTHONUNBUFFERED: "1"
