name: task-bot

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: task-bot-run
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - run: python main.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}

      - name: Commit updated task state
        run: |
          if ! git diff --quiet -- data/tasks.json; then
            git config user.name "task-bot"
            git config user.email "task-bot@users.noreply.github.com"
            git add data/tasks.json
            git commit -m "chore: update task state"
            git push
          fi
